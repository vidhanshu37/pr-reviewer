services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pr-reviewer-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: prreviewer
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prreviewer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: pr-reviewer-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: pr-reviewer-app
    ports:
      - "8081:8081"
    env_file: .env                       # secrets: GitHub App, OAuth, Groq, Gemini ... (never baked into the image)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prreviewer
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_ENABLED: "true"
      AGENT_BASE_URL: http://agent:8000  # TODO: must match the property AgentClient reads
    volumes:
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build: ../pr-reviewer-agent
    container_name: pr-reviewer-agent
    ports:
      - "8000:8000"
    env_file: ../pr-reviewer-agent/.env  # NVIDIA_API_KEY, LLM_PROVIDER, AGENT_PARALLEL ...
    environment:
      MCP_URL: http://app:8081/mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - app

volumes:
  pgvector_data:
  redis_data: