services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pr-reviewer-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: prreviewer
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pr-reviewer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgvector_data:
  redis_data: